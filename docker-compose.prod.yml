

services:
  # Flask API Server
  api:
    image: duma-api:produccion
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: duma-api-produccion
    restart: unless-stopped
    ports:
      - "${PORT}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SECRET_KEY=docker-secret-key-change-in-production
      - JWT_SECRET_KEY=docker-jwt-secret-key-change-in-production
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    networks:
      - duma-network-produccion
      - db_duma-dbpostgress-produccion



  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: duma-redis-produccion
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data_produccion:/data
    command: redis-server --appendonly yes
    networks:
      - duma-network-produccion

  # Celery Worker
  celery-worker:
    image: celery-worker:produccion
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duma-celery-worker-produccion
    restart: unless-stopped
    command: celery -A app.celery worker --loglevel=info
    environment:
      - FLASK_ENV=${FLASK_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SECRET_KEY=docker-secret-key-change-in-production
    depends_on:
      redis:
        condition: service_started
    networks:
      - duma-network-produccion
      - db_duma-dbpostgress-produccion

  # Celery Beat (Scheduler)
  celery-beat:
    image: celery-beat:produccion
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duma-celery-beat-produccion
    restart: unless-stopped
    command: celery -A app.celery beat --loglevel=info
    environment:
      - FLASK_ENV=${FLASK_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SECRET_KEY=docker-secret-key-change-in-production
    depends_on:
      redis:
        condition: service_started
    networks:
      - duma-network-produccion
      - db_duma-dbpostgress-produccion

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: duma-nginx-produccion
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - duma-network-produccion
    profiles:
      - production

networks:
  duma-network-develop:
    driver: bridge
  duma-network-testing:
    driver: bridge
  duma-network-produccion:
    driver: bridge    
  db_duma-dbpostgress-produccion:
    external: true       
volumes:
  redis_data_produccion:
