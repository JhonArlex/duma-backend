

services:
  # Flask API Server
  api:
    image: duma-api:testing
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duma-api-testing
    restart: unless-stopped
    ports:
      - "${PORT}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SECRET_KEY=docker-secret-key-change-in-production
      - JWT_SECRET_KEY=docker-jwt-secret-key-change-in-production
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    networks:
      - duma-network-testing
      - db_duma-dbpostgress-testing



  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: duma-redis-testing
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data_testing:/data
    command: redis-server --appendonly yes
    networks:
      - duma-network-testing

  # Celery Worker
  celery-worker:
    image: duma-celery-worker:testing
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duma-celery-worker-testing
    restart: unless-stopped
    command: celery -A app.celery worker --loglevel=info
    environment:
      - FLASK_ENV=${FLASK_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SECRET_KEY=docker-secret-key-change-in-production
    depends_on:
      redis:
        condition: service_started
    networks:
      - duma-network-testing

  # Celery Beat (Scheduler)
  celery-beat:
    image: duma-celery-beat:testing
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duma-celery-beat-testing
    restart: unless-stopped
    command: celery -A app.celery beat --loglevel=info
    environment:
      - FLASK_ENV=${FLASK_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SECRET_KEY=docker-secret-key-change-in-production
    depends_on:
      redis:
        condition: service_started
    networks:
      - duma-network-testing

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: duma-nginx-testing
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - duma-network-testing
    profiles:
      - production

networks:
  duma-network-develop:
    driver: bridge
  duma-network-testing:
    driver: bridge
  duma-network-produccion:
    driver: bridge
  db_duma-dbpostgress-testing:
    external: true    
volumes:
  redis_data_testing:
