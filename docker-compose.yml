

services:
  # Flask API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duma-api-${ENV}
    restart: unless-stopped
    ports:
      - "${PORT}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SECRET_KEY=docker-secret-key-change-in-production
      - JWT_SECRET_KEY=docker-jwt-secret-key-change-in-production
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    networks:
      - duma-network-${ENV}



  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: duma-redis-${ENV}
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - duma-network-${ENV}

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duma-celery-worker-${ENV}
    restart: unless-stopped
    command: celery -A app.celery worker --loglevel=info
    environment:
      - FLASK_ENV=${FLASK_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SECRET_KEY=docker-secret-key-change-in-production
    depends_on:
      redis:
        condition: service_started
    networks:
      - duma-network-${ENV}

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duma-celery-beat-${ENV}
    restart: unless-stopped
    command: celery -A app.celery beat --loglevel=info
    environment:
      - FLASK_ENV=${FLASK_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SECRET_KEY=docker-secret-key-change-in-production
    depends_on:
      redis:
        condition: service_started
    networks:
      - duma-network-${ENV}

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: duma-nginx-${ENV}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - duma-network-${ENV}
    profiles:
      - production

networks:
  duma-network-develop:
    driver: bridge
  duma-network-testing:
    driver: bridge
  duma-network-produccion:
    driver: bridge    
