

services:
  # Flask API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duma-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ENCRYPTION_KEY=nMEvK-N0E1LPb_uKnNR2lw2AadR8hPsiB65RCyQ7pZ8
      - SECRET_KEY=docker-secret-key-change-in-production
      - JWT_SECRET_KEY=docker-jwt-secret-key-change-in-production
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    networks:
      - duma-network



  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: duma-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - duma-network

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duma-celery-worker
    restart: unless-stopped
    command: celery -A app.celery worker --loglevel=info
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ENCRYPTION_KEY=nMEvK-N0E1LPb_uKnNR2lw2AadR8hPsiB65RCyQ7pZ8
      - SECRET_KEY=docker-secret-key-change-in-production
    depends_on:
      redis:
        condition: service_started
    networks:
      - duma-network

  # Celery Beat (Scheduler)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: duma-celery-beat
    restart: unless-stopped
    command: celery -A app.celery beat --loglevel=info
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ENCRYPTION_KEY=nMEvK-N0E1LPb_uKnNR2lw2AadR8hPsiB65RCyQ7pZ8
      - SECRET_KEY=docker-secret-key-change-in-production
    depends_on:
      redis:
        condition: service_started
    networks:
      - duma-network

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: duma-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - duma-network
    profiles:
      - production

networks:
  duma-network:
    driver: bridge

volumes:
  redis_data:
